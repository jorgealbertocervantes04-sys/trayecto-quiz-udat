name: Verificar TRAYECTO Quiz
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar API
        run: npm test
      - name: Compilar para Vercel
        run: npm run build
